name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto (usa SpotFlow.zip ou MusicFlow.zip se existir no repositorio)
        run: |
          Z=""
          if [ -f SpotFlow.zip ]; then Z=SpotFlow.zip; elif [ -f MusicFlow.zip ]; then Z=MusicFlow.zip; fi
          if [ -n "$Z" ]; then
            mkdir -p _proj
            unzip -q -o "$Z" -d _proj
            d=$(find _proj -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n1)
            if [ -z "$d" ]; then echo "ERRO: settings.gradle.kts nao encontrado dentro do zip"; exit 1; fi
            echo "PROJ_DIR=$d" >> "$GITHUB_ENV"
          else
            echo "PROJ_DIR=." >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Instalar SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Compilar APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpotFlow-debug-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk
