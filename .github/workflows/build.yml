name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto (usa MusicFlow.zip se existir no repositorio)
        run: |
          if [ -f MusicFlow.zip ]; then
            mkdir -p _proj
            unzip -q -o MusicFlow.zip -d _proj
            d=$(find _proj -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n1)
            if [ -z "$d" ]; then echo "ERRO: settings.gradle.kts nao encontrado dentro do zip"; exit 1; fi
            echo "PROJ_DIR=$d" >> "$GITHUB_ENV"
          else
            echo "PROJ_DIR=." >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Compilar APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-debug-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk
